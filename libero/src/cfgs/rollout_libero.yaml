defaults:
- _self_
- override hydra/job_logging: disabled
- override hydra/hydra_logging: disabled
exp_name: ${env.benchmark_id}_s${seed}_warmup10
seed: 42
results_dir: results
num_rollouts: 32
num_videos: 4
cache_rollouts: false
outer_policy:
  _target_: src.outer_policies.pi_policy.PiPolicy
  pi_client:
    _target_: src.vla.pi_client.PIClient
    policy_name: pi05_libero
    host_ip: 127.0.0.1
    host_port: 8400
  chunk_size: 10
env:
  _target_: src.envs.liberoenv.LiberoMultiStepEnv
  env:
    _target_: src.envs.liberoenv.LiberoEnv
    benchmark_id: libero_90
    task_id: 14
    max_steps: 400
    image_resolution:
    - 256
    - 256
    use_negative_rewards: true
    reward_scale: 1.0
    done_at_timeout: false
    seed: ${seed}
  chunk_size: ${outer_policy.chunk_size}
  auto_reset: false
  benchmark_id: ${.env.benchmark_id}
  task_id: ${.env.task_id}
  fps: 20
hydra:
  output_subdir: null
  run:
    dir: .
