[project]
name = "gsbr-libero"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==1.26.4", "jax==0.5.3", "flax==0.10.6", "optax==0.2.8",
  "distrax==0.1.5", "ml-collections==1.1.0", "tensorflow-probability==0.25.0",
  "gymnasium==1.3.0", "gym==0.26.2", "cloudpickle==3.1.2", "opencv-python==4.11.0.86", "hydra-core==1.3.5", "json-numpy==2.1.1", "requests>=2.32",
  "robosuite==1.4.1", "mujoco==3.9.0", "bddl==1.0.1", "easydict==1.9", "future==0.18.2",
  "imageio[ffmpeg]==2.37.4", "matplotlib==3.11.1", "wandb==0.28.1",
  "torch==2.9.1", "scipy>=1.13", "termcolor", "tqdm>=4.67", "pillow>=11",
]

[project.optional-dependencies]
cuda = ["jax[cuda12]==0.5.3"]
test = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
